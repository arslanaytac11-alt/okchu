workflows:
  ios-capacitor-workflow:
    name: Okchu 1.1.0 — manual release candidate
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Start explicitly in Codemagic. A push never builds or publishes a release.
    # This workflow produces a signed artifact; uploading/review/release are separate.
    environment:
      groups:
        - okchu
      ios_signing:
        # Reuse signing identities already uploaded to Codemagic.
        # Missing/expired identities must be resolved deliberately by the account owner.
        distribution_type: app_store
        bundle_identifier: com.arslanaytac.okchu
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APP_ID: 6762461650
        BUNDLE_ID: com.arslanaytac.okchu
        # Set OKCHU_BUILD_NUMBER when manually starting the workflow, to an integer
        # greater than every build already uploaded to App Store Connect.
      node: 20
      xcode: "27.1"
      cocoapods: default
    scripts:
      - name: Check release toolchain and explicit build number
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -version | /usr/bin/grep -q '^Xcode 27\.1$' || {
            echo "This release requires Xcode 27.1 for iPhone Duo."; exit 1;
          }
          case "${OKCHU_BUILD_NUMBER:-}" in
            ''|*[!0-9]*) echo "Set OKCHU_BUILD_NUMBER to the next unused positive build number."; exit 1 ;;
          esac
          [ "$OKCHU_BUILD_NUMBER" -gt 0 ] || exit 1
      - name: Install locked npm dependencies
        script: |
          set -euo pipefail
          npm ci
          node ios/scripts/prepare-capacitor-cli.cjs
      - name: Build web assets and sync Capacitor
        script: |
          set -euo pipefail
          npm run cap:sync
      - name: Check source and synced release assets
        script: |
          set -euo pipefail
          python3 ios/scripts/verify-release.py
      - name: Use existing uploaded signing identities
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Set explicitly selected build number
        script: |
          set -euo pipefail
          cd ios/App
          agvtool new-version -all "$OKCHU_BUILD_NUMBER"
      - name: Build signed IPA artifact
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Verify exported application identity and assets
        script: |
          set -euo pipefail
          python3 ios/scripts/verify-release.py --ipa-dir build/ios/ipa --build-number "$OKCHU_BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Deliberately no publishing block. Review the artifact and completed device
    # checks before a separate App Store Connect upload and manual release.
